{% extends 'base.html' %}

{% block title %}Список продуктов{% endblock %}

{% block content %}

<h2>Список продуктов</h2>
<ul class="list-group">
    {% for product in products %}
        <li class="list-group-item">
            {{ product.product_name }} - {{ product.product_description }} - {{ product.category }} - {{ product.price }}
        </li>
    {% endfor %}
</ul>
{% endblock %}
